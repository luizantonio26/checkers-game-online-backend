version: '3.8'

services:
  web:
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env.dev

  celery:
    build: .
    command: bash -c "celery -A base worker -l INFO"
    env_file:
      - .env.dev
