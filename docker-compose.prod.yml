version: '3.8'

services:
  web:
    command: bash -c "uv run python manage.py migrate && uv run gunicorn  base.asgi:application -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --workers 4 --threads 2 --log-level info"
    ports:
      - "8000:8000"
    env_file:
      - .env.prod

  celery:
    build: .
    command: bash -c "celery -A base worker --loglevel=INFO"
    env_file:
      - .env.prod
