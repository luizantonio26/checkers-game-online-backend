version: '3.8'

services:
  web:
    command: bash -c "python manage.py migrate && hypercorn base.asgi:application --config hypercorn_config.toml"
    ports:
      - "8000:8000"
    env_file:
      - .env.prod

  celery:
    build: .
    command: bash -c "celery -A base worker --loglevel=INFO"
    env_file:
      - .env.prod
